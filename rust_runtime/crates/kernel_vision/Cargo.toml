[package]
name = "kernel_vision"
version = "0.1.0"
edition = "2021"
description = "Fused, vision-specific CPU kernels: ToMe-style token/patch merging and tiled (flash-attention-style) 2D windowed attention, for use ahead of or inside a Runner backend."

[dependencies]
ndarray = "0.15"
rayon = "1.10"
anyhow = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "kernels"
harness = false
