name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linters
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check formatting (black)
      run: black --check python_client/

    - name: Check imports (isort)
      run: isort --check-only python_client/

    - name: Lint (ruff)
      run: ruff check python_client/

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests with coverage
      run: |
        pytest python_client/tests/ -v --tb=short --cov=oxidizedvision --cov-report=xml

    - name: Upload coverage
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_runtime
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Check formatting
      run: cargo fmt --all --check

    # runner_tch and runner_tensorrt link against proprietary SDKs
    # (LibTorch, TensorRT) that aren't available on a stock runner, so CI
    # scopes to the crates/examples that build with just the Rust toolchain.
    - name: Clippy
      run: |
        cargo clippy -p runner_core -p runner_tract -p runner_ort \
          -p image_server -p denoiser_cli -- -D warnings

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_runtime
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build
      run: |
        cargo build --verbose -p runner_core -p runner_tract -p runner_ort \
          -p image_server -p denoiser_cli

    - name: Test
      run: |
        cargo test --verbose -p runner_core -p runner_tract -p runner_ort

  rust-macos-coreml:
    name: Rust Build (macOS, CoreML feature)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust_runtime
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build with coreml feature
      run: |
        cargo build --verbose -p runner_ort -p image_server --features coreml

    - name: Test
      run: |
        cargo test --verbose -p runner_ort --features coreml
