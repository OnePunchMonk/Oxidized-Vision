name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'  # Run every Monday at 2 AM UTC

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e "."

    - name: Convert example models
      run: |
        python -m oxidizedvision.cli convert examples/example_unet/config.yml
        python -m oxidizedvision.cli convert examples/example_detector/config.yml
        python -m oxidizedvision.cli convert examples/example_pointnet/config.yml

    - name: Run benchmarks
      run: |
        python benchmarks/run_benchmark.py \
          --model out/unet.pt \
          --runners torchscript,tract,ort \
          --iters 50 \
          --format json > benchmark_results_unet.json
        python benchmarks/run_benchmark.py \
          --model out/detector.pt \
          --input-shape 1,3,320,320 \
          --runners torchscript,tract,ort \
          --iters 50 \
          --format json > benchmark_results_detector.json
        python benchmarks/run_benchmark.py \
          --model out/pointnet.pt \
          --input-shape 1,3,1024 \
          --runners torchscript,tract,ort \
          --iters 50 \
          --format json > benchmark_results_pointnet.json
        cat benchmark_results_unet.json benchmark_results_detector.json benchmark_results_pointnet.json

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmark_results_*.json
